name: Deploy Web To EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-web-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Yarn via Corepack
        run: |
          corepack enable
          corepack prepare yarn@3.6.3 --activate
          corepack yarn --version

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Prepare build env file
        env:
          WEB_ENV_FILE: ${{ secrets.WEB_ENV_FILE }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -n "${WEB_ENV_FILE:-}" ]; then
            printf '%s' "$WEB_ENV_FILE" > .env
          elif [ -n "${VITE_API_BASE_URL:-}" ]; then
            printf 'VITE_API_BASE_URL=%s\n' "$VITE_API_BASE_URL" > .env
          else
            echo "WEB_ENV_FILE (or VITE_API_BASE_URL) secret is required."
            exit 1
          fi

      - name: Build web app
        run: corepack yarn web:build

      - name: Archive web build
        run: tar -czf web-dist.tar.gz -C src/renderer/dist .

      - name: Upload build archive to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT != '' && secrets.EC2_PORT || 22 }}
          source: web-dist.tar.gz
          target: /tmp/qode-web/${{ github.sha }}

      - name: Activate release on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          REMOTE_APP_DIR: ${{ vars.EC2_APP_DIR }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT != '' && secrets.EC2_PORT || 22 }}
          envs: REMOTE_APP_DIR,RELEASE_SHA
          script: |
            set -eu

            if [ -z "${REMOTE_APP_DIR:-}" ]; then
              REMOTE_APP_DIR="/var/www/qode-web"
            fi

            RELEASES_DIR="$REMOTE_APP_DIR/releases"
            RELEASE_DIR="$RELEASES_DIR/$RELEASE_SHA"
            CURRENT_LINK="$REMOTE_APP_DIR/current"
            TMP_DIR="/tmp/qode-web/$RELEASE_SHA"

            mkdir -p "$RELEASE_DIR"
            tar -xzf "$TMP_DIR/web-dist.tar.gz" -C "$RELEASE_DIR"
            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

            ls -1dt "$RELEASES_DIR"/* 2>/dev/null | tail -n +6 | xargs -r rm -rf || true

            rm -rf "$TMP_DIR"
